name: Weather
description: Current conditions, high/low, and local time from the free Open-Meteo API
# Seconds this app stays on screen per rotation.
dwell: 15
# Re-fetch the forecast this often (seconds). 10 min is well under Open-Meteo's free limits.
refresh_interval: 600
# Location to forecast. Defaults to New York City — override per-environment in config.yaml.
latitude: 40.7128
longitude: -74.0060
# Short place name shown in the header (top-left). Long names are clipped to fit.
location_label: "New York"
# Open-Meteo forecast endpoint. The full request URL (lat/lon + fields) is assembled in code.
api_base: "https://api.open-meteo.com/v1/forecast"

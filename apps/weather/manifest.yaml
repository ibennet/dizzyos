name: Weather
description: Current conditions, high/low, and local time from the free Open-Meteo API
# Seconds this app stays on screen per rotation.
dwell: 15
# Re-fetch the forecast this often (seconds). 10 min is well under Open-Meteo's free limits.
refresh_interval: 600
# Location by ZIP / postal code, geocoded to coordinates via api.zippopotam.us.
# Set `zipcode` to your area. For outside the US, set `country` to the ISO code
# (e.g. "gb", "ca", "de") and use the local postal code.
zipcode: "10001"
country: "us"
# Fallback coordinates, used only if `zipcode` is blank or can't be resolved.
latitude: 40.7128
longitude: -74.0060
# Header place name. Leave blank to auto-fill from the ZIP's town + state.
location_label: ""
# Show "Rain at HH:MM" when the next hour's chance of rain (within 24h) is at least
# this percent. Raise to make the alert less chatty; there's no alert below it.
rain_probability_threshold: 30
# Clock and rain-time format: "12h" (3:17 PM) or "24h" (15:17).
time_format: "12h"
# Seconds each of the weather icon's three animation states is held, so a full cycle
# is three times this. Lower is livelier — below ~0.2 the rain reads as flicker rather
# than as falling — but on a sign glanced at rather than watched, slower is calmer.
icon_frame_seconds: 0.8
# APIs (rarely need changing).
api_base: "https://api.open-meteo.com/v1/forecast"
geocode_base: "https://api.zippopotam.us"

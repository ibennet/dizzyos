# dizzyos runtime configuration.
# CLI flags (--led-rows, --led-chain, ...) override anything here at launch.

matrix:
  rows: 64
  cols: 64
  chain: 2                       # two 64x64 panels chained -> a 128x64 canvas
  parallel: 1
  brightness: 70
  # --- Pi-only (ignored by the Mac emulator) ---
  hardware_mapping: adafruit-hat-pwm   # use "adafruit-hat" if you didn't solder the PWM jumper
  gpio_slowdown: 4                     # 4 is a safe default on a Pi 4
  # pixel_mapper_config: "Rotate:90"   # uncomment to stack the panels as a tall 64x128

launcher:
  rotation:                      # apps cycle in this order
    - cafe_menu
    - weather
    - subway
  default_dwell: 20              # seconds per app when an app doesn't set its own
  target_fps: 24
  # How one app hands off to the next. Options:
  #   slide       iPad-style — both frames travel together, eased in and out
  #   crossfade   the two frames dissolve through each other
  #   wipe        incoming revealed left to right, neither frame moves
  #   blank_wipe  outgoing wipes away to black, then incoming wipes in
  #   cut_wipe    outgoing cuts to black, brief hold, then incoming wipes in
  #   none        hard cut, no animation
  transition: slide
  transition_ms: 600

apps:
  cafe_menu: {}                  # defaults come from apps/cafe_menu/manifest.yaml;
                                 # override menu_url / scroll_speed / dwell here if needed
  weather:                       # defaults come from apps/weather/manifest.yaml;
    zipcode: "10022"             # set `zipcode` (or latitude/longitude) + location_label here
    location_label: "New York"   # explicit label wins over the ZIP's auto-derived town
    time_format: "24h"           # 12h (3:17 PM) or 24h (15:17)
  subway: {}                     # defaults come from apps/subway/manifest.yaml;
                                 # override `stops` here to follow different stations

# PR titles become the squash commits on main and drive release-please's
# version/CHANGELOG computation, so they must be Conventional Commits:
# type(scope): summary. Scopes are the repo's area taxonomy ("release" is
# reserved for release-please's own PRs). No subject-case rule — summaries
# are lowercase by convention, but backticked identifiers/acronyms make a
# hard lint more annoying than helpful.
name: pr-title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          requireScope: true
          types: |
            feat
            fix
            refactor
            perf
            docs
            test
            build
            ci
            chore
            revert
          scopes: |
            kernel
            apps
            tools
            tooling
            cad
            dev
            fonts
            docs
            ci
            release
